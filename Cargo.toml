[package]
name = "superseedr"
version = "1.0.14"
description = "A BitTorrent Client in your Terminal."
edition = "2021"
repository = "https://github.com/Jagalite/superseedr"
license = "GPL-3.0-or-later"
authors = ["Jaga Tranvo <jagatranvo@gmail.com>"]
exclude = ["web/**"]

[workspace]
members = [".", "fuzz"]
default-members = ["."]
exclude = ["web/wasm"]
resolver = "2"

[profile.release]
codegen-units = 1 # Allows compiler to perform better optimization.
lto = true # Enables Link-time Optimization.
opt-level = 3 # Prioritizes small binary size. Use `3` if you prefer speed.
strip = true # Ensures debug symbols are removed.

[package.metadata.bundle]
name = "superseedr"
identifier = "com.github.jagalite.superseedr"
icon = ["assets/app_icon.icns"] # Optional: Uncomment and provide path if you have an icon
version = "1.0.14"
copyright = "Copyright © 2025 Jaga Tranvo. All rights reserved."
category = "public.app-category.utilities"
short_description = "A BitTorrent Client in your Terminal."
long_description = "A BitTorrent Client in your Terminal, written in Rust using Ratatui."
linux_use_terminal = true
linux_mime_types = ["application/x-bittorrent", "x-scheme-handler/magnet"]
linux_exec_args = "%U" # Use %U to handle URLs and potentially multiple files, or %f for single files


[package.metadata.wix]
eula = false
linker-args = ["-ext", "WixFirewallExtension"]
compiler-args = ["-ext", "WixFirewallExtension"]

[features]
# Default build includes both DHT and PEX
default = ["dht", "pex"]

# Individual features for conditional compilation
dht = []
pex = []
synthetic-load = []
webtorrent = ["dep:webrtc", "dep:webrtc-sctp", "dep:tokio-tungstenite", "dep:futures-util", "dep:rustls"]


[dev-dependencies]
tempfile = "3.27.0"
proptest = "1.11.0"
proptest-state-machine = "0.8"

[dependencies]
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.18"
tracing = "0.1.44"
serde = { version = "1.0.228", features = ["derive"] }
serde_bencode = "0.2"
serde_bytes = "0.11.19"
magnet-url = "3.0.0"
data-encoding = "2.11.0"
urlencoding = "2.1.3"
rand = "0.10.1"
toml = "1.1.2"
hex = "0.4"
strum = "0.28.0"
strum_macros = "0.28.0"
fuzzy-matcher = "0.3.7"
chrono = "0.4.44"
serde_json = "1.0.149"
regex = "1.12.2"
url = "2.5.8"
ratatui = { version = "=0.30.2", default-features = false, features = ["all-widgets", "layout-cache", "macros", "std", "underline-color"] }
bitflags = "2.13.0"
web-time = { version = "1.1.0", features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
webrtc = { version = "=0.17.1", optional = true }
# SCTP 0.17.2 adds a required Config field that webrtc 0.17.1 does not initialize.
webrtc-sctp = { version = "=0.17.1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3", features = ["sink"], optional = true }
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0"
feed-rs = "2.3.1"
libc = "0.2.186"
notify = "8.2.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
reqwest = { version = "0.13.4", features = ["json"] }
rlimit = "0.11"
socket2 = { version = "0.6.3", features = ["all"] }
sysinfo = "0.39.6"
tokio = { version = "1.50.0", features = ["full", "test-util"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tracing-subscriber = "0.3.23"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.2", features = ["wasm_js"] }
tokio = { version = "1.50.0", default-features = false, features = ["io-util", "macros", "rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }
