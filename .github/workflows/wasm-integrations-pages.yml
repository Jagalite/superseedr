name: WASM Integrations Pages Experiment

on:
  push:
    branches:
      - wasm-integrations

permissions: {}

concurrency:
  group: wasm-integrations-pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Validate and build WASM site
    if: github.ref == 'refs/heads/wasm-integrations'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            web/wasm/target/
          key: ${{ runner.os }}-superseedr-wasm-integrations-pages-${{ hashFiles('Cargo.lock', 'web/wasm/Cargo.lock') }}

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.104 --locked

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run host WASM helpers
        run: cargo test --manifest-path web/wasm/Cargo.toml --locked

      - name: Check WASM target
        run: cargo check --manifest-path web/wasm/Cargo.toml --target wasm32-unknown-unknown --locked

      - name: Lint WASM target
        run: cargo clippy --manifest-path web/wasm/Cargo.toml --target wasm32-unknown-unknown --all-targets --locked -- -D warnings

      - name: Run real-WASM contracts
        working-directory: web/wasm
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --target wasm32-unknown-unknown --locked

      - name: Build static site
        working-directory: web
        run: npm run build

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run bundled browser contracts
        working-directory: web
        run: npm run test:browser

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    name: Deploy WASM site to GitHub Pages
    if: github.ref == 'refs/heads/wasm-integrations'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
