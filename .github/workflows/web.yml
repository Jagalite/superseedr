name: Superseedr Web

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "src/**"
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "src/**"
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  native_regression:
    name: Native regression
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-superseedr-native-${{ hashFiles('Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test default features
        run: cargo test --locked

      - name: Test all features
        run: cargo test --all-targets --all-features --locked

      - name: Test without default features
        run: cargo test --all-targets --no-default-features --locked

      - name: Lint all features
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Lint without default features
        run: cargo clippy --all-targets --no-default-features --locked -- -D warnings

      - name: Verify release package
        run: cargo package --allow-dirty --locked

      - name: Verify packaged root library for WASM
        shell: bash
        run: |
          package_dir="$(mktemp -d)"
          tar -xzf target/package/superseedr-*.crate -C "$package_dir"
          manifest="$(find "$package_dir" -mindepth 2 -maxdepth 2 -name Cargo.toml -print -quit)"
          test -n "$manifest"
          cargo check --manifest-path "$manifest" --lib --target wasm32-unknown-unknown --locked

  web_build:
    name: Web build and browser contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            web/wasm/target/
          key: ${{ runner.os }}-superseedr-web-${{ hashFiles('Cargo.lock', 'web/wasm/Cargo.lock') }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.104 --locked

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run host WASM helpers
        run: cargo test --manifest-path web/wasm/Cargo.toml --locked

      - name: Check WASM target
        run: cargo check --manifest-path web/wasm/Cargo.toml --target wasm32-unknown-unknown --locked

      - name: Lint WASM target
        run: cargo clippy --manifest-path web/wasm/Cargo.toml --target wasm32-unknown-unknown --all-targets --locked -- -D warnings

      - name: Run real-WASM contracts
        working-directory: web/wasm
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --target wasm32-unknown-unknown --locked

      - name: Build static site
        working-directory: web
        run: npm run build

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run bundled browser contracts
        working-directory: web
        run: npm run test:browser

      - name: Upload static build artifact
        uses: actions/upload-artifact@v7
        with:
          name: superseedr-web-static
          path: web/dist
          if-no-files-found: error
          retention-days: 14
